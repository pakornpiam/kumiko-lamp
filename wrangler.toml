# Cloudflare Workers with static assets. The site is one self-contained file --
# web/index.html makes no external request at all -- so the build is a copy, set
# as the project's build command in the dashboard:
#
#     mkdir -p dist && cp web/index.html dist/
#
# It has to assemble dist/ rather than serve web/ directly: web/ also holds
# extract.js and the two test scripts, which have no business being served.
#
# This is a Worker, not a Pages project, because the dashboard's "import a
# repository" flow creates one -- which is also why the build runs a deploy
# command of its own (`npx wrangler deploy`).  That command reads [assets] from
# here; `pages_build_output_dir` is the Pages spelling and makes it fail with
# "Missing entry-point to Worker script or to assets directory".
#
# `main` is set, so this Worker now sees EVERY request -- including the page
# itself.  That is why [assets] gained a binding name: worker/index.js has to
# call env.ASSETS.fetch() explicitly for anything that is not /api/*, and
# without it the site stops serving.
#
# The export service (container/) is reached through EXPORT_SERVICE when bound,
# or EXPORT_ORIGIN as a plain URL.  The second is what lets `wrangler dev` talk
# to a container running on localhost, which is the only way to exercise the
# paid path without deploying.
name = "kumiko-lamp"
main = "worker/index.js"
compatibility_date = "2026-08-07"

[assets]
directory = "./dist"
binding = "ASSETS"

# Sessions, magic-link tokens and Stripe entitlement.  KV rather than D1
# because the account token carries workers_kv but no d1 scope, and nothing
# here needs a join.  Eventually consistent, so a just-cancelled subscription
# can survive a short window -- acceptable for this, and why stripe.js also
# checks the period end rather than trusting the key's presence alone.
#
#   npx wrangler kv namespace create KUMIKO      <- then paste the id below
[[kv_namespaces]]
binding = "KUMIKO"
id = "PLACEHOLDER_RUN_WRANGLER_KV_NAMESPACE_CREATE"

# The CSG generator.  A container rather than a Worker because manifold3d is a
# native C++ extension and Workers are V8 isolates -- that constraint is the
# whole reason this is not just another endpoint in worker/index.js.
#
# The build context is the repo root, not container/, because the image needs
# requirements.txt and kumiko_lamp.py from the top level; the Dockerfile's COPY
# paths are written relative to that.
#
# It has no route of its own.  The only way in is the Durable Object below,
# which only worker/index.js can reach -- so the entitlement check cannot be
# stepped around by calling the generator directly.
[[containers]]
class_name = "ExportContainer"
image = "./container/Dockerfile"
image_build_context = "."
instance_type = "standard-1"
# CSG is CPU-bound and a build peaks around 21s at the worst slider settings, so
# more instances buys throughput, not speed.  The container also caps its own
# concurrency at MAX_CONCURRENT and returns 503 rather than queueing.
max_instances = 3

[[durable_objects.bindings]]
name = "EXPORT_CONTAINER"
class_name = "ExportContainer"

# Durable Objects need a migration to be created.  Bump the tag and add another
# block for later changes; never edit this one after it has been deployed.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ExportContainer"]

# Set with `npx wrangler secret put <NAME>`, never in this file:
#   STRIPE_SECRET_KEY     STRIPE_WEBHOOK_SECRET     RESEND_API_KEY
# Plain vars (safe to commit) go in [vars]:
#   STRIPE_PRICE_ID   MAIL_FROM
# EXPORT_ORIGIN is dev-only -- in production the container binding is used.
